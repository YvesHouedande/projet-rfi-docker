# Airflow 3 (LocalExecutor) + PostgreSQL + SonarQube (profil "quality").
# Les tâches d'ingestion sont lancées par le DockerOperator sur le démon Docker de l'hôte.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.2}
  image: rfi-airflow:${AIRFLOW_VERSION:-3.3.2}
  user: "${AIRFLOW_UID}:0"
  # Groupe propriétaire du socket Docker de l'hôte (renseigné par `make init`).
  group_add:
    - "${DOCKER_GID}"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB_NAME}
    # Authentification : simple auth manager, mot de passe fixe (admin / admin).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_passwords.json
    # Variables Airflow (une Variable d'environnement prend le pas sur celle de l'UI).
    AIRFLOW_VAR_RFI_FEEDS: ${RFI_FEEDS}
    AIRFLOW_VAR_RFI_INGEST_IMAGE: ${RFI_INGEST_IMAGE}
    AIRFLOW_VAR_RFI_DATA_VOLUME: ${RFI_DATA_VOLUME}
    AIRFLOW_VAR_RFI_DOCKER_NETWORK: ${RFI_DOCKER_NETWORK}
    AIRFLOW_VAR_RFI_FETCH_CONCURRENCY: ${RFI_FETCH_CONCURRENCY}
    AIRFLOW_VAR_RFI_POSTGRES_HOST: rfi-postgres
    AIRFLOW_VAR_RFI_POSTGRES_DB: ${RFI_POSTGRES_DB}
    AIRFLOW_VAR_RFI_POSTGRES_USER: ${RFI_POSTGRES_USER}
    AIRFLOW_VAR_RFI_POSTGRES_PASSWORD: ${RFI_POSTGRES_PASSWORD}
    AIRFLOW_VAR_RFI_RETENTION_DAYS: ${RFI_RETENTION_DAYS}
    AIRFLOW_VAR_DOCKERHUB_USER: ${DOCKERHUB_USER}
    AIRFLOW_VAR_DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}
    AIRFLOW_VAR_RFI_IMAGE_TAG: ${RFI_IMAGE_TAG}
    AIRFLOW_VAR_RFI_PROJECT_DIR: ${RFI_PROJECT_DIR}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - rfi-net
  depends_on:
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # Métadonnées d'Airflow.
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - rfi-net

  # Données RFI (table rfi_articles).
  rfi-postgres:
    image: postgres:16
    container_name: rfi-postgres
    environment:
      POSTGRES_USER: ${RFI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RFI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RFI_POSTGRES_DB}
    ports:
      - "127.0.0.1:${RFI_POSTGRES_PORT:-5433}:5432"
    volumes:
      - rfi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RFI_POSTGRES_USER} -d ${RFI_POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - rfi-net

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped

  # Qualité de code : docker compose --profile quality up -d (ou `make sonar-up`).
  sonarqube:
    image: sonarqube:community
    profiles: ["quality"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - rfi-net

networks:
  # Nom explicite : le DockerOperator retrouve le réseau par son nom exact.
  rfi-net:
    name: rfi-net

# Le volume de données « rfi-data » n'est pas déclaré ici : Docker le crée au premier
# montage par le DockerOperator.
volumes:
  airflow-db-data:
  rfi-postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
